name: Diagnóstico polla.cl

# Responde la pregunta que el repo nunca midió: ¿qué bloquea exactamente polla.cl
# desde GitHub Actions? Sin eso, elegir entre relay serverless, proxy o cambiar de
# fuente es adivinar.
#
# No toca datos ni hace commits: solo sondea y reporta en el log de la corrida.
# Se dispara a mano desde la pestaña Actions.

on:
  workflow_dispatch:
    inputs:
      sondas:
        description: "Sondas a correr"
        required: true
        default: "todas"
        type: choice
        options:
          - todas
          - directo
          - movil
          - impersonate
          - playwright
          - relay

permissions:
  contents: read # Solo lee el repo; el diagnóstico no escribe nada

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mostrar IP de salida del runner
        # El dato que hay que cruzar con el bloqueo: si polla.cl filtra por rango,
        # esta IP debería caer dentro de los rangos publicados de Azure/GitHub.
        run: |
          echo "IP pública del runner:"
          curl -sS --max-time 15 https://api.ipify.org || echo "(no se pudo obtener)"
          echo
          echo "Datos del ASN:"
          curl -sS --max-time 15 https://ipinfo.io/json || echo "(no se pudo obtener)"

      - name: Instalar curl-cffi
        # Barato (~5 s) y lo necesita la sonda 'impersonate'; se instala siempre
        # para no tener que ramificar por sonda.
        run: pip install curl-cffi

      - name: Instalar Playwright + Chromium
        # Descargar el browser tarda ~1 min, así que solo cuando de verdad se va
        # a usar: la sonda 'playwright' o la corrida completa.
        if: inputs.sondas == 'playwright' || inputs.sondas == 'todas'
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Correr diagnóstico
        env:
          # Vacíos hasta que el relay esté desplegado; la sonda 'relay' lo reporta
          # como no configurado en vez de fallar.
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          if [ "${{ inputs.sondas }}" = "todas" ]; then
            python scripts/diagnostico_polla.py --json diagnostico.json
          else
            python scripts/diagnostico_polla.py --probe "${{ inputs.sondas }}" --json diagnostico.json
          fi

      - name: Publicar informe como artifact
        # El log de Actions caduca y se corta; el JSON permite comparar corridas
        # entre plataformas de relay sin depender de leer el log a ojo.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-polla
          path: diagnostico.json
          retention-days: 30
